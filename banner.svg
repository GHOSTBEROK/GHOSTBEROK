<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">GHOSTBEROK</title>
  <desc id="d">GHOSTBEROK. Engineering Beyond Boundaries. Securing. Building. Researching. Innovating. A diagram shows one core connected to five domains: security, engineering, intelligence, research and innovation.</desc>
